<text x="112" y="879" class="k">DURABLE OPERATIONS</text>
<rect x="112" y="902" width="206" height="48" rx="9" fill="#edf1ff"/><text x="215" y="932" text-anchor="middle" class="boxh">PostgreSQL</text>
<rect x="336" y="902" width="224" height="48" rx="9" fill="#fff5e8"/><text x="448" y="932" text-anchor="middle" class="boxh">Redis · RQ</text>
<text x="112" y="985" class="small">Tenants · projects · credentials · jobs · heartbeats</text>
<text x="656" y="879" class="k">TOOLS &amp; RESEARCH RESOURCES</text>
<rect x="656" y="902" width="238" height="48" rx="9" fill="#eaf5f1"/><text x="775" y="932" text-anchor="middle" class="boxh">Scholarly indexes</text>
<rect x="912" y="902" width="232" height="48" rx="9" fill="#f1edf9"/><text x="1028" y="932" text-anchor="middle" class="boxh">Model endpoints</text>
<text x="656" y="985" class="small">OpenAlex · Crossref · Semantic Scholar · Europe PMC · arXiv · GROBID</text>
<text x="1238" y="879" class="k">RESEARCH OUTPUTS &amp; GOVERNANCE</text>
<rect x="1238" y="902" width="220" height="48" rx="9" fill="#edf1ff"/><text x="1348" y="932" text-anchor="middle" class="boxh">Artifact volume</text>
<rect x="1476" y="902" width="212" height="48" rx="9" fill="#eaf5f1"/><text x="1582" y="932" text-anchor="middle" class="boxh">Human approval</text>
<text x="1238" y="985" class="small">Markdown · LaTeX · BibTeX · ledgers · audit · manifests</text>

<text x="82" y="1080" class="small">ARGUMENTUM is research workflow infrastructure. It does not replace source verification, statistical review, ethics oversight, or human peer review.</text>
