[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argumentum-research"
version = "1.0.0"
description = "Self-hosted multi-agent research infrastructure for scholarly literature discovery, evidence synthesis, methodological critique, and reproducible manuscript workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Argumentum Contributors" }]
keywords = ["research", "multi-agent", "literature-review", "academic-writing", "evidence-synthesis", "reproducibility"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Text Processing :: Markup",
]
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=5.0"]
docx = ["python-docx>=1.1"]
langgraph = ["langgraph>=1.0,<2"]
crewai = ["crewai>=1.0,<2"]
microsoft-agent-framework = ["agent-framework>=1.0"]
all-documents = ["pypdf>=5.0", "python-docx>=1.1"]
server = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "SQLAlchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "redis>=5,<7", "rq>=2,<3", "python-multipart>=0.0.9,<1"]
dev = ["pytest>=8.0", "ruff==0.17.5", "fastapi>=0.115,<1", "SQLAlchemy>=2.0,<3", "alembic>=1.14,<2", "httpx>=0.27,<1", "redis>=5,<7", "rq>=2,<3", "python-multipart>=0.0.9,<1"]

[project.scripts]
argumentum = "argumentum.cli:main"
argumentum-preflight = "argumentum.preflight:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: tests requiring explicitly enabled live services or external APIs",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.setuptools.package-data]
argumentum = ["py.typed"]
"argumentum.server" = ["static/*.html"]
