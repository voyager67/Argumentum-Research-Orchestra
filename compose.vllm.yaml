services:
  vllm:
    image: vllm/vllm-openai:v0.33.0
    profiles: [vllm]
    restart: unless-stopped
    command:
      - --model
      - ${VLLM_MODEL:-Qwen/Qwen2.5-14B-Instruct}
      - --host
      - 0.0.0.0
      - --api-key
      - ${VLLM_API_KEY:?Set VLLM_API_KEY in .env before starting vLLM}
    environment:
      HF_HOME: /models
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      - vllm_models:/models
    expose:
      - "8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ipc: host
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 5m
    networks: [backend]

volumes:
  vllm_models:
