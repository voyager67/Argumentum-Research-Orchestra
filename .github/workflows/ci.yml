name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Ruff lint
        run: ruff check . --output-format=github
      - name: Check shipped researcher UI JavaScript
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate UI script syntax
        run: python scripts/check-ui-js.py

  framework-adapters:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - extra: langgraph
          - extra: crewai
          - extra: microsoft-agent-framework
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install one optional framework adapter
        run: python -m pip install -e ".[dev,${{ matrix.extra }}]"
      - name: Exercise the selected adapter
        run: python -m pytest tests/test_harnesses.py tests/test_workflow_harnesses.py -vv

  live-postgres-redis-rq:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.12-alpine3.23
        env:
          POSTGRES_DB: argumentum_ci
          POSTGRES_USER: argumentum_ci
          POSTGRES_PASSWORD: argumentum_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U argumentum_ci -d argumentum_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.2.17-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://argumentum_ci:argumentum_ci_password@127.0.0.1:5432/argumentum_ci
      REDIS_URL: redis://127.0.0.1:6379/15
      ARGUMENTUM_LIVE_INTEGRATION: "1"
      ARGUMENTUM_JOB_RETRIES: "0"
      ARGUMENTUM_TIMEOUT_SECONDS: "30"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install server and integration dependencies
        run: python -m pip install -e ".[dev,server,all-documents]"
      - name: Verify live PostgreSQL migration and Redis/RQ worker execution
        run: python -m pytest tests/integration/test_live_postgres_redis_rq.py -vv

  self-hosted-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate disposable local deployment secrets
        run: python scripts/init-selfhost.py
      - name: Validate default and inference-profile Compose configuration
        run: |
          docker compose config --quiet
          docker compose --profile ollama config --quiet
          docker compose -f compose.yaml -f compose.gpu.yaml --profile ollama config --quiet
          docker compose -f compose.yaml -f compose.vllm.yaml --profile vllm config --quiet
          docker compose -f compose.yaml -f compose.grobid.yaml --profile documents config --quiet
          docker compose --profile sandbox config --quiet
      - name: Build application container
        run: docker build --tag argumentum-research:ci .
      - name: Build isolated experiment runner image
        run: docker build --file Dockerfile.sandbox --tag argumentum-sandbox:ci .

  docker-compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate disposable deployment secrets
        run: python scripts/init-selfhost.py
      - name: Build and start the real service stack
        run: |
          docker compose build api
          docker compose up --detach postgres redis api worker reconciler
      - name: Submit and verify a real offline research run
        run: python scripts/ci-compose-smoke.py
      - name: Show service status if the smoke test fails
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=200 api worker reconciler postgres redis
      - name: Remove CI containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
